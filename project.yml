name: MealPlanner
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  MealPlannerCore:
    path: MealPlannerCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 4X292LGV9D
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  MealPlanner:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - MealPlanner
    dependencies:
      - package: MealPlannerCore
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.muhve.mealplanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Meal Planner
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
schemes:
  MealPlanner:
    build:
      targets:
        MealPlanner: all
    run:
      config: Debug
    archive:
      config: Release
